name: Баг-репорт
description: Сообщить об ошибке в работе приложения или сбое интерфейса
title: "[Bug]: "
labels: ["kind: bug", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Перед созданием тикета убедитесь, что проблемы нет в [списке уже открытых задач](https://github.com/re-dtf/client/issues).
        Для общих вопросов и помощи лучше написать в [Telegram](https://t.me/re_dtf).

  - type: input
    id: summary
    attributes:
      label: Краткое описание проблемы
      placeholder: Например: При клике на ответ в ветке комментариев скролл прыгает в начало
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Область приложения
      options:
        - Лента постов (Feed)
        - Просмотр поста (Post)
        - Комментарии (Comments)
        - Редактор (Editor)
        - Окна и оверлеи (Navigation / Modals)
        - Настройки (Settings)
        - Авторизация / Прокси (Auth / Proxy)
        - PWA / Кеширование / Оффлайн
        - Темы оформления
        - Другое
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Операционная система
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Браузер / Окружение
      options:
        - Chrome / Chromium-based
        - Firefox
        - Safari / WebKit
        - Установленное приложение (Capacitor)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Версия клиента
      placeholder: Отображается в настройках ()"О приложении")

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть ленту
        2. Нажать на комментарии к посту...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Логи консоли браузера / сетевые ошибки
      description: Скопируйте ошибки из DevTools Console/Network, если они есть.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Контрольный список
      options:
        - label: Я проверил, что этот баг ещё не был зарегистрирован
          required: true
        - label: Проблема воспроизводится на последней актуальной версии
          required: true
