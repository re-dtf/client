name: Deploy Dev to Cloudflare Pages

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: "pages-dev"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Cloudflare Pages всегда хостит проекты в корне (имя.pages.dev), поэтому базовый путь пустой
          BASE_PATH: ''

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Имя проекта в Cloudflare Pages. Если он не существует, wrangler попробует его создать
          command: pages deploy build --project-name redtf-dev
