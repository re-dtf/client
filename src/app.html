<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#D9F5FF" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#202022" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/icons/fav-default.svg" id="app-favicon" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" id="app-manifest" />

		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="re:DTF" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/app-default-180.png" id="app-apple-touch-icon" />

		%sveltekit.head%
		<script>
			try {
				const saved = JSON.parse(localStorage.getItem('redtf:setup:completed'));
				if (saved?.v === 1 && saved.d === true) document.documentElement.dataset.splash = 'off';
				const st = JSON.parse(localStorage.getItem('redtf:settings'));
				if (st?.d?.disableMobileTopBar) document.documentElement.dataset.disableMobileTopBar = 'true';
				const themeId = st?.d?.theme ?? 'redtf';
				if (themeId === 'redtf') {
					const themeSt = JSON.parse(localStorage.getItem('redtf:theme:redtf'));
					if (themeSt?.d?.headerBlur) document.documentElement.dataset.headerBlur = 'true';
					if (themeSt?.d?.mobileBarBlur) document.documentElement.dataset.mobileBarBlur = 'true';
					if (themeSt?.d?.mobileBarFloating) document.documentElement.dataset.mobileBarFloating = 'true';
				}
				const supportsDark = themeId === 'redtf';
				const cs = st?.d?.colorScheme ?? 'auto';
				const isDark = supportsDark && (cs === 'dark' || (cs === 'auto' && window.matchMedia?.('(prefers-color-scheme: dark)').matches === true));
				document.documentElement.dataset.colorScheme = cs;
				document.documentElement.dataset.themeMode = isDark ? 'dark' : 'light';
				const meta = document.querySelector('meta[name="color-scheme"]');
				if (meta) meta.content = supportsDark && cs === 'auto' ? 'light dark' : isDark ? 'dark' : 'light';
				const themeColors = {
					dtf2022: { light: '#D9F5FF', dark: '#202022' },
					redtf: { light: '#D9F5FF', dark: '#202022' }
				};
				const currentColors = themeColors[themeId] || themeColors.redtf;
				const darkColor = currentColors.dark;
				const lightColor = currentColors.light;
				const themeMetas = document.querySelectorAll('meta[name="theme-color"]');
				if (cs === 'dark' || (supportsDark && isDark)) {
					themeMetas.forEach((m) => m.setAttribute('content', darkColor));
				} else if (cs === 'light' || (!isDark && supportsDark)) {
					themeMetas.forEach((m) => m.setAttribute('content', lightColor));
				}
				if (isDark) {
					const lock = document.createElement('meta');
					lock.name = 'darkreader-lock';
					document.head.appendChild(lock);
				}
				const appIcon = st?.d?.appIcon ?? 'default';
				const customIcon = st?.d?.customIconData;
				if (appIcon === 'custom' && customIcon) {
					const isSvg = customIcon.startsWith('data:image/svg');
					const fav = document.getElementById('app-favicon');
					if (fav) {
						fav.type = isSvg ? 'image/svg+xml' : 'image/png';
						fav.href = customIcon;
					}
					const apple = document.getElementById('app-apple-touch-icon');
					if (apple) apple.href = customIcon;
					const mf = document.getElementById('app-manifest');
					if (mf) {
						const dynMf = {
							name: 're:DTF',
							short_name: 're:DTF',
							display: 'standalone',
							background_color: '#141414',
							theme_color: isDark ? darkColor : lightColor,
							icons: [
								{ src: customIcon, sizes: 'any', type: isSvg ? 'image/svg+xml' : 'image/png', purpose: 'any' },
								{ src: customIcon, sizes: 'any', type: isSvg ? 'image/svg+xml' : 'image/png', purpose: 'maskable' }
							]
						};
						mf.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(dynMf));
					}
				} else if (appIcon === 'bluer' || appIcon === 'white') {
					const fav = document.getElementById('app-favicon');
					if (fav) {
						fav.type = 'image/svg+xml';
						fav.href = `%sveltekit.assets%/icons/fav-${appIcon}.svg`;
					}
					const apple = document.getElementById('app-apple-touch-icon');
					if (apple) apple.href = `%sveltekit.assets%/icons/app-${appIcon}-180.png`;
					const mf = document.getElementById('app-manifest');
					if (mf) mf.href = `%sveltekit.assets%/manifest-${appIcon}.webmanifest`;
				}
			} catch {}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<style>
			html[data-splash='off'] #splash { display: none; }

			/*
			 * Заставка до загрузки приложения. Атрибуты ставит $lib/splash.ts: data-state нет — логотип по центру
			 * на белом, welcome — логотип уехал наверх, фон стал размытым; data-leaving — всё растворяется
			 * на том месте, где было. Подробнее: docs/architecture/splash.md
			 */
			#splash {
				--ty: calc(50cqh - 96px); /* сдвиг логотипа: от 47px сверху до середины экрана */
				--s: 1.8;
				--paper: 255 255 255;
				--ink: #000;
				--inOut: cubic-bezier(0.77, 0, 0.175, 1);
				--out: cubic-bezier(0.165, 0.84, 0.44, 1);
				position: fixed; inset: 0; z-index: 9998; /* Ниже окна приветствия (9999) */
				container-type: size; /* 50cqh — середина экрана без привязки к адресной строке */
			}
			@media (prefers-color-scheme: dark) {
				#splash { --paper: 0 0 0; --ink: #fff; }
			}
			html[data-color-scheme='dark'] #splash { --paper: 0 0 0; --ink: #fff; }
			html[data-color-scheme='light'] #splash { --paper: 255 255 255; --ink: #000;
			}

			/* Фон: белый → полупрозрачный и сильно размытый, под ним проступает приложение */
			#splash .splash-bg {
				position: absolute; inset: 0;
				background: rgb(var(--paper) / 1);
				-webkit-backdrop-filter: blur(0px); backdrop-filter: blur(0px);
				transition: background-color 1.1s var(--inOut), backdrop-filter 1.3s var(--inOut),
					-webkit-backdrop-filter 1.3s var(--inOut), opacity 0.6s ease;
			}
			#splash[data-state='welcome'] .splash-bg {
				background: rgb(var(--paper) / 0.8);
				-webkit-backdrop-filter: blur(12.5px); backdrop-filter: blur(12.5px);
			}
			#splash[data-leaving] .splash-bg {
				background: rgb(var(--paper) / 0);
				-webkit-backdrop-filter: blur(0px); backdrop-filter: blur(0px);
				opacity: 0;
			}

			/* Логотип: стоит там, где ему место на приветствии (47px от верха), а по центру его держит сдвиг.
			   Масштаб лежит в самом transform: отдельное свойство scale умножило бы и сдвиг, и логотип уехал бы в сторону */
			#splash .splash-logo {
				position: absolute; top: 47px; left: 50%; width: 134px;
				transform-origin: 50% 0;
				transform: translate(-50%, var(--ty)) scale(var(--s));
				transition: transform 1.1s var(--inOut), opacity 0.5s ease;
			}
			#splash[data-state='welcome'] { --ty: 0px; --s: 1; }
			#splash[data-leaving] .splash-logo {
				opacity: 0;
				transform: translate(-50%, var(--ty)) scale(calc(var(--s) * 1.08));
				transition: transform 0.6s var(--out), opacity 0.5s ease;
			}
			#splash svg { display: block; width: 100%; height: auto; overflow: visible; }
			#splash .re { fill: #1693e5; }
			#splash .dtf { fill: var(--ink); }

			/* Появление: буквы всплывают по очереди, точки «падают» и дальше прыгают волной */
			#splash .g {
				opacity: 0;
				animation: splash-rise 0.7s var(--out) calc(var(--i) * 70ms + 100ms) both;
			}
			#splash .dot {
				transform-box: fill-box; transform-origin: center;
				animation: splash-drop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) calc(var(--i) * 70ms + 100ms) both,
					splash-hop 1s ease-in-out calc(var(--i) * 70ms + 800ms) infinite;
			}
			/* Логотип доехал до приветствия (точки стоят после прыжка): прыгать перестают, падение остаётся доигранным */
			#splash[data-state] .dot { animation-name: splash-drop; }
			@keyframes splash-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
			@keyframes splash-drop {
				from { opacity: 0; transform: translateY(-16px) scale(0.4); }
				to { opacity: 1; transform: none; }
			}
			@keyframes splash-hop {
				0%, 45%, 100% { transform: none; }
				22% { transform: translateY(-4px); }
			}

			#splash .splash-tagline {
				position: absolute; top: 47px; left: 0; right: 0; text-align: center;
				font: 200 10px/8px Roboto, system-ui, sans-serif; color: var(--ink);
				opacity: 0; transition: opacity 0.6s ease;
			}
			#splash[data-state='welcome'] .splash-tagline { opacity: 1; transition-delay: 0.8s; }

			/* Подсказка, если загрузка затянулась: появляется под логотипом, её включает $lib/splash.ts */
			#splash .splash-hint {
				position: absolute; top: calc(50cqh + 80px); left: 0; right: 0; padding: 0 24px;
				text-align: center; font: 300 14px/1.5 Roboto, system-ui, sans-serif; color: var(--ink);
				opacity: 0; visibility: hidden; transition: opacity 0.4s ease, visibility 0s 0.4s;
			}
			#splash .splash-hint[data-show] { opacity: 1; visibility: visible; transition-delay: 0s; }
			#splash .splash-hint button {
				display: block; margin: 6px auto 0; padding: 4px 8px; cursor: pointer;
				font: 500 14px/1.5 Roboto, system-ui, sans-serif; color: #317df0;
			}

			@media (prefers-reduced-motion: reduce) {
				#splash .splash-bg, #splash .splash-logo, #splash .splash-tagline, #splash .splash-hint { transition-duration: 0.01ms; transition-delay: 0s; }
				#splash .g, #splash .dot { animation: none; opacity: 1; }
			}
		</style>

			<div class="splash-bg"></div>
			<div class="splash-logo" aria-hidden="true">

				</svg>
				<div class="splash-tagline">Неофициальный клиент</div>
			</div>
			<div class="splash-hint" role="status">
				Загрузка длится дольше ожидаемого
				<button type="button">Пропустить</button>
			</div>
		</div>

		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
